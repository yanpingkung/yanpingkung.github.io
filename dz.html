<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#120c08">
<title>道長控制台 · 延平宮</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道長控制台">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="dz-icon.png">
<style>
  :root{--bg:#120c08;--card:#24140d;--line:#6a4a2a;--gold:#ecc86a;--txt:#f2e2c0;--dim:#b8a07a}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"PingFang TC","Noto Sans TC",sans-serif}
  body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px 0}
  h1{font-size:18px;letter-spacing:.2em;color:var(--gold);margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
  h1 small{font-size:13px;letter-spacing:.05em;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:15px;color:var(--txt);background:#1c100a;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
  button.on{background:#7a2a18;border-color:var(--gold);color:#fff3d6}
  button.gold{background:linear-gradient(#e2b04e,#a8742a);color:#2a1608;border-color:#f0cc72}
  input{font:inherit;font-size:16px;flex:1;min-width:0;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:#1c100a;color:var(--txt);outline:none}
  input:focus{border-color:var(--gold)}
  .lab{font-size:12px;color:var(--dim);margin:0 0 6px}
  #who{font-size:13px;color:var(--dim);line-height:1.7}
  #feed{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:6px;min-height:120px}
  .m{background:#1c100a;border-radius:10px;padding:6px 10px;font-size:15px;line-height:1.5;max-width:92%;word-break:break-all}
  .m b{color:var(--gold);font-weight:600} .m i{font-style:normal;font-size:11px;color:var(--dim);margin-left:6px}
  .m.dz{align-self:flex-end;background:#5a1e12;border:1px solid #c89a46}
  .sys{align-self:center;font-size:12px;color:var(--dim)}
  #say{position:sticky;bottom:0;background:var(--bg);padding:8px 0 max(10px,env(safe-area-inset-bottom));display:flex;gap:6px}
  #toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#3a2210;border:1px solid var(--gold);border-radius:10px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<h1>🛕 道長控制台 <small id="ol">連線中…</small></h1>

<div class="card">
  <div class="lab">遊戲裡的狀態</div>
  <div class="row" id="st"><button data-s="法事中">法事中</button><button data-s="休息中">休息中</button><button data-s="外出">外出</button></div>
</div>
<div class="card">
  <div class="lab">頭上掛的字(20 字內,空白送出=拿掉)</div>
  <div class="row"><input id="note" maxlength="20" placeholder="例:下午三點補財庫"><button id="noteBtn">掛上</button></div>
</div>
<div class="card">
  <div class="row" style="justify-content:space-between"><span class="lab" style="margin:0">客人自由打字</span>
    <span class="row"><button data-c="on">開放</button><button data-c="off">只能常用語</button><button id="snd">🔔 提示音</button></span></div>
</div>
<div class="card"><div class="lab">線上的人</div><div id="who">—</div></div>

<div id="feed"><div class="sys">這裡會即時顯示大家的聊天,你說的話會出現在遊戲裡道長頭上</div></div>
<div id="say"><input id="msg" maxlength="40" placeholder="以道長身分說話…" enterkeyhint="send"><button class="gold" id="sendBtn">送出</button></div>
<div id="toast"></div>

<script type="module">
const ENDPOINT='https://script.google.com/macros/s/AKfycbx0aLK95KGfwEOXsj_Klaaa-hDEnblplJkP4wbuXUydkwHeKeCWtIW1OkG7Dpwwd3beHA/exec';
const FB={apiKey:'AIzaSyBkjlZ15iM7iGeXlbnd4jQ7_zRYWfqTbHE',authDomain:'yanping-online.firebaseapp.com',databaseURL:'https://yanping-online-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'yanping-online',appId:'1:271190196229:web:77e60c91f1ac1b35b89c6c'};
const $=id=>document.getElementById(id), esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// 金鑰放在網址 # 後面(不會傳到伺服器),第一次打開後記在這支手機
// 網址保留 #k=…,這樣「加到主畫面」時金鑰會跟著存進捷徑(iPhone 主畫面捷徑跟 Safari 不共用儲存)
const hk=new URLSearchParams(location.hash.slice(1)).get('k'); if(hk) ls.set('dz_key',hk);
let KEY=hk||ls.get('dz_key'); if(KEY&&!hk) history.replaceState(null,'','#k='+KEY);
const toast=(t,ms=2200)=>{const e=$('toast'); e.textContent=t; e.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.opacity=0,ms);};
async function admin(op,v=''){if(!KEY){toast('沒有金鑰,請用道長專屬連結打開'); return null;}
  try{const r=await (await fetch(ENDPOINT,{method:'POST',body:JSON.stringify({admin:KEY,op,v})})).json(); if(!r.ok) toast(r.err==='key'?'金鑰不對':'失敗,再試一次'); return r;}catch(e){toast('網路有問題'); return null;}}

// ── 狀態 / 頭上字 / 聊天開關 ──
const mark=(sel,attr,val)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle('on',b.dataset[attr]===val));
async function refresh(){const r=await admin('get'); if(!r?.ok) return; mark('#st button','s',r.status); mark('[data-c]','c',r.chat); if(document.activeElement!==$('note')) $('note').value=r.note||'';}
document.querySelectorAll('#st button').forEach(b=>b.onclick=async()=>{mark('#st button','s',b.dataset.s); if((await admin('status',b.dataset.s))?.ok) toast('遊戲裡已改為「'+b.dataset.s+'」');});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{mark('[data-c]','c',b.dataset.c); if((await admin('chat',b.dataset.c))?.ok) toast(b.dataset.c==='on'?'已開放自由打字':'已改成只能用常用語');});
$('noteBtn').onclick=async()=>{const v=$('note').value.trim(); if((await admin('note',v))?.ok) toast(v?'已掛上:'+v:'已拿掉頭上的字');};

// ── 聊天紀錄(只存在這支手機,最多 60 則) ──
let log=[]; try{log=JSON.parse(ls.get('dz_log')||'[]');}catch(e){}
let sound=ls.get('dz_snd')!=='off'; const sndBtn=$('snd'); const setSnd=()=>{sndBtn.classList.toggle('on',sound); sndBtn.textContent=sound?'🔔 提示音':'🔕 靜音';}; setSnd();
sndBtn.onclick=()=>{sound=!sound; ls.set('dz_snd',sound?'on':'off'); setSnd();};
let ac=null; const beep=()=>{if(!sound) return; try{ac=ac||new AudioContext(); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.12,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.26);}catch(e){} navigator.vibrate?.(60);};
function add(m,save=true){const f=$('feed'), d=document.createElement('div'); d.className='m'+(m.dz?' dz':'');
  const tm=new Date(m.at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
  d.innerHTML=`<b>${esc(m.n)}</b>:${esc(m.t)}<i>${tm}</i>`; f.appendChild(d); f.scrollTop=f.scrollHeight;
  if(save){log.push(m); log=log.slice(-60); ls.set('dz_log',JSON.stringify(log));}}
log.forEach(m=>add(m,false));
const send=async()=>{const v=$('msg').value.trim(); if(!v) return; $('msg').value=''; const r=await admin('say',v); if(!r?.ok) $('msg').value=v;};
$('sendBtn').onclick=send; $('msg').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault(); send();}};

// ── 即時:線上名單 + 聊天 ──
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
const D=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
const db=D.getDatabase(initializeApp(FB)), root=D.ref(db,'p'), peers=new Map(); let off=0, ready=false;
D.onValue(D.ref(db,'.info/serverTimeOffset'),v=>off=v.val()||0);
const now=()=>Date.now()+off;
function who(){const live=[...peers.entries()].filter(([id,p])=>id!=='__dz__'&&now()-(p.t||0)<90000);
  $('ol').textContent=`線上 ${live.length} 人`; $('who').textContent=live.length?live.map(([,p])=>p.n||'善信').join('、'):'目前沒有人';}
function up(id,r){const old=peers.get(id); peers.set(id,r);
  if(r?.s&&r.s!==old?.s&&(ready||now()-(r.t||0)<20000)){const t=r.s.slice(0,r.s.lastIndexOf(':'));
    if(id==='__dz__') add({n:'🛕 大祐道長',t,at:Date.now(),dz:true}); else{add({n:r.n||'善信',t,at:Date.now()}); beep();}}
  who();}
D.onChildAdded(root,v=>up(v.key,v.val())); D.onChildChanged(root,v=>up(v.key,v.val())); D.onChildRemoved(root,v=>{peers.delete(v.key); who();});
setTimeout(()=>ready=true,1500); setInterval(who,15000);
refresh(); setInterval(refresh,30000);
if(!KEY){const k=prompt('請貼上道長金鑰(在道長專屬連結 #k= 後面那串)'); if(k&&k.trim()){ls.set('dz_key',k.trim()); location.hash='k='+k.trim(); location.reload();} else add({n:'系統',t:'這支手機還沒有金鑰,請用道長專屬連結打開',at:Date.now()},false);}
</script>
</body>
</html>
